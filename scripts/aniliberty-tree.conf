# Configuration of aniliberty-tree (read by aniliberty-tree.service; also used when the script runs by hand
# with `set -a; . /etc/aniliberty-tree.conf; set +a`).

# Archive roots with AniLiberty/AniLibria torrents, separated by ":".
# Any layout works: one folder with everything, years, separate folders for movies/ongoing, several disks.
# Keep values in single quotes: they may contain spaces, and both systemd and the shell understand them.
ANILIBERTY_SOURCES='/media/aniliberty'

# Trees for the Jellyfin libraries ("Shows" and "Movies").
ANILIBERTY_SERIES='/srv/aniliberty-series'
ANILIBERTY_MOVIES='/srv/aniliberty-movies'

# How many grouping folder levels (years, categories…) to descend under each source.
ANILIBERTY_MAX_DEPTH='4'

# Regex of folder/file names to skip, e.g. ANILIBERTY_EXCLUDE='^(Manga|Music|OST)$'
ANILIBERTY_EXCLUDE=''
