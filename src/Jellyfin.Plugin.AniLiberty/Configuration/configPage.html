<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>AniLiberty Metadata</title>
</head>
<body>
<div id="aniLibertyConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="aniLibertyConfigForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">AniLiberty Metadata</h2>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="text" id="SiteUrl" label="Адрес AniLiberty" />
                    <div class="fieldDescription">API берётся из /api/v1. Зеркала: https://aniliberty.top, https://anilibria.top</div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="text" id="ShikimoriUrl" label="Адрес Shikimori" />
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="EnableShikimoriFallback" />
                        <span>Искать на Shikimori, если релиза нет на AniLiberty</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="PreferEnglishTitle" />
                        <span>Английское/ромадзи название вместо русского</span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="ImportTeam" />
                        <span>Добавлять команду озвучки в «Люди»</span>
                    </label>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="number" id="TorrentIndexRefreshHours" min="1" label="Обновлять индекс торрентов, часов" />
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Сохранить</span></button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var pluginId = '5b7c3f7e-2c1a-4d7e-9a57-7a1b0c0de001';
            var page = document.querySelector('#aniLibertyConfigPage');
            var text = ['SiteUrl', 'ShikimoriUrl', 'TorrentIndexRefreshHours'];
            var bool = ['EnableShikimoriFallback', 'PreferEnglishTitle', 'ImportTeam'];

            page.addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    text.forEach(function (k) { page.querySelector('#' + k).value = config[k]; });
                    bool.forEach(function (k) { page.querySelector('#' + k).checked = config[k]; });
                    Dashboard.hideLoadingMsg();
                });
            });

            page.querySelector('#aniLibertyConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    text.forEach(function (k) { config[k] = page.querySelector('#' + k).value; });
                    config.TorrentIndexRefreshHours = parseInt(config.TorrentIndexRefreshHours, 10) || 24;
                    bool.forEach(function (k) { config[k] = page.querySelector('#' + k).checked; });
                    ApiClient.updatePluginConfiguration(pluginId, config).then(Dashboard.processPluginConfigurationUpdateResult);
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
